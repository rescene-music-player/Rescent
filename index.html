<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리센느 – 향기를 따라 돌아간 날</title>
<style>
:root{--bg:#f4f7fb;--panel:#ffffff;--ink:#1c2430;--sub:#6b7686;--acc:#4a9be8;--line:#d9e1ec;--c1:#dbeafe;--c2:#ede9fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#18202b;--ink:#e8edf4;--sub:#93a0b2;--acc:#6ab0f5;--line:#2a3544;--c1:#1b2b45;--c2:#2a2347;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--sub)}
#top button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:2px 10px;font-size:12px}
#media{flex:1;min-height:0;margin:0 12px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:15px;padding:12px}
#media .big{font-size:42px;margin-bottom:8px}
#media img{max-width:100%;max-height:100%;object-fit:contain}
#media iframe{width:100%;aspect-ratio:16/9;border:0}
#media a{color:var(--acc);font-size:13px;margin-top:6px}
#src{font-size:11px;color:var(--sub);margin:4px 16px 0;min-height:14px}
#box{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:8px 12px 12px;padding:14px 16px;min-height:140px;cursor:pointer}
#who{font-weight:700;color:var(--acc);font-size:14px;margin-bottom:6px;min-height:18px}
#txt{font-size:16px;line-height:1.7;white-space:pre-line}
#hint{text-align:right;font-size:12px;color:var(--sub);margin-top:6px}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--ink);font-size:15px;line-height:1.5}

body{transition:background 1.2s,color 1.2s}
#title{display:none}
body.cine{--bg:#000;--panel:#000;--ink:#f2efe6;--sub:#8a8a8a;--line:#222;--acc:#e9d9a6}
.cine #title{display:block;font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-size:24px;letter-spacing:.28em;text-align:center;color:#e9d9a6;margin-bottom:12px;animation:rise 2.6s ease both}
@keyframes rise{from{opacity:0;letter-spacing:.7em;transform:translateY(10px)}to{opacity:1;letter-spacing:.28em;transform:none}}
.cine #media{background:#000;border:1px solid #222;border-radius:4px}
.cine #box{border:0;text-align:center}
.cine #who{display:none}
.cine #txt{font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-size:18px;line-height:2;letter-spacing:.03em;text-shadow:0 0 12px rgba(233,217,166,.35)}
.cine #hint{text-align:center}

@keyframes warp{0%{filter:none;transform:none}25%{filter:blur(3px) hue-rotate(40deg);transform:scale(1.05) skewX(3deg)}55%{filter:blur(9px) hue-rotate(-50deg) brightness(1.5);transform:scale(.95) skewX(-4deg) rotate(1deg)}80%{filter:blur(4px) brightness(1.2);transform:scale(1.03) skewX(2deg)}100%{filter:none;transform:none}}
body.warp>*{animation:warp 3s ease-in-out}
</style>
</head>

/*11*/{loc:"2024.03.26 · 무대 뒤",media:{t:"ph",from:"쇼케이스 영상 (원하는 장면)"},who:"멤버",text:"“이제 정말 올라가네요. 잘할 수 있을까.”\n스태프의 신호와 함께 조명이 켜진다. 모두가 숨을 고른다.",choices:[{t:"“지금의 떨림도 나중엔 향기처럼 기억될 거예요.”",go:12,s:1},{t:"“틀려도 괜찮아요. 여기 있는 사람들은 전부 여러분 편이에요.”",go:12,s:1}]},

  $("loc").textContent=s.loc||"";
  $("sc").textContent="🌸 "+sc;
  $("who").textContent=s.who||"";
  clearInterval(timer);
  document.querySelectorAll(".ch").forEach(n=>n.remove());
  $("hint").style.display="none";
  full=s.text;typing=true;let n=0;const sp=s.cine?85:32;
  $("txt").textContent="";
  timer=setInterval(()=>{n++;$("txt").textContent=full.slice(0,n)+"▌";if(n>=full.length)finish()},sp);
  try{localStorage.setItem(KEY,JSON.stringify({i:i,sc:sc}))}catch(e){}
}
function go(n,add){if(n>=S.length)return;hist.push({i:i,sc:sc});sc+=add||0;i=n;show()}
$("box").onclick=()=>{if(typing){finish();return}const s=S[i];if(s.choices)return;go(s.next!==undefined?s.next:i+1)};
$("back").onclick=()=>{if(hist.length){const h=hist.pop();i=h.i;sc=h.sc;show()}};
$("reset").onclick=()=>{hist=[];i=0;sc=0;show()};
show();
</script>
